name: Verify FACKTS Music
on:
  push:
    branches: [feat/session2-professional-onboarding]
  pull_request:
    branches: [main, feat/phase2-unified-workspaces]
jobs:
  checks:
    name: Tests and TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

      - name: Compile Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder

      - name: Install Chromium for rendered homepage regression
        run: npx playwright install --with-deps chromium
      - name: Verify rendered homepage and route isolation
        run: node tests/browser/homepage-audit.mjs
      - name: Upload real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-browser-evidence
          path: /tmp/homepage-recovery/verified
