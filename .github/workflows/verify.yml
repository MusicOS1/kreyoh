name: Verify FACKTS Music
on:
  push:
    branches: [feat/session2-professional-onboarding, feat/session3-creative-production]
  pull_request:
    branches: [main, feat/phase2-unified-workspaces, feat/session2-professional-onboarding]
jobs:
  checks:
    name: Tests and TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npx tsc --noEmit

      - name: Compile Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder

      - name: Install Chromium for rendered homepage regression
        run: npx playwright install --with-deps chromium
      - name: Verify Session 3 production, approvals and multipart recovery
        run: node tests/browser/session3-production.mjs
      - name: Verify Session 2 onboarding and collaboration
        run: node tests/browser/session2-acceptance.mjs
      - name: Verify persistent sessions, playback and professional workspaces
        run: node tests/browser/session-repair.mjs
      - name: Verify compact cards and background interaction failures
        run: node tests/browser/interaction-cards.mjs
      - name: Verify rendered homepage and route isolation
        run: node tests/browser/homepage-audit.mjs
      - name: Verify shared public header
        run: node tests/browser/public-header.mjs
      - name: Upload real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-browser-evidence
          path: |
            /tmp/homepage-recovery/verified
            /tmp/shared-public-header
            /tmp/session3-production/*.png
            /tmp/session3-production/Results.json
            /tmp/session2-acceptance
            /tmp/kreyoh-phase2-screenshots
            /tmp/kreyoh-interaction-cards
